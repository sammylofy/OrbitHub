<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OrbitHub{% endblock %}</title>

    <style>
        /* CSS Variables for Light & Dark Themes */
        :root {
            --bg-color: #f5f7fa;
            --text-color: #333333;
            --navbar-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --dropdown-hover: #f3f4f6;
            --dropdown-text: #444444;
            --shadow: 0 2px 20px rgba(0,0,0,0.08);
            --accent-color: #2563eb;
            --border-color: #e5e7eb;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --navbar-bg: #1e293b;
            --dropdown-bg: #1e293b;
            --dropdown-hover: #334155;
            --dropdown-text: #cbd5e1;
            --shadow: 0 2px 20px rgba(0,0,0,0.4);
            --accent-color: #3b82f6;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* Navbar */
        .navbar {
            background: var(--navbar-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            height: 70px;
        }

        .logo a {
            text-decoration: none;
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            align-items: center;
        }

        .nav-menu li {
            position: relative;
        }

        .nav-menu > li > a {
            display: block;
            padding: 1.4rem 1.25rem;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-menu > li > a:hover {
            color: var(--accent-color);
        }

        /* Dropdown */
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 220px;
            background: var(--dropdown-bg);
            list-style: none;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);

            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all .25s ease;
        }

        .nav-menu li:hover .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown li a {
            display: block;
            padding: 12px 18px;
            text-decoration: none;
            color: var(--dropdown-text);
            transition: background .3s, color .3s;
        }

        .dropdown li a:hover {
            background: var(--dropdown-hover);
            color: var(--accent-color);
        }

        /* Theme Toggle Button */
        .theme-toggle {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: scale(1.05);
        }

        /* Mobile Menu */
        #menu-toggle {
            display: none;
        }

        .hamburger {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-color);
        }

        @media(max-width: 768px) {
            .hamburger {
                display: block;
            }

            .nav-menu {
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                flex-direction: column;
                background: var(--navbar-bg);
                border-bottom: 1px solid var(--border-color);

                max-height: 0;
                overflow: hidden;
                transition: max-height .4s ease;
            }

            #menu-toggle:checked ~ .nav-menu {
                max-height: 600px;
            }

            .nav-menu li {
                width: 100%;
            }

            .nav-menu li a {
                padding: 1rem;
            }

            .dropdown {
                position: static;
                visibility: visible;
                opacity: 1;
                transform: none;
                box-shadow: none;
                border: none;
                display: none;
                background: rgba(0, 0, 0, 0.02);
            }

            .nav-menu li:hover .dropdown {
                display: block;
            }
        }

        /* Page Content */
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
    </style>

    {% block styles %}{% endblock %}
</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <div class="logo">
            <a href="{{ url_for('home') }}">OrbitHub</a>
        </div>

        <div class="nav-right">
            <!-- Theme Toggle Button -->
            <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme">
                🌙
            </button>

            <label for="menu-toggle" class="hamburger">
                ☰
            </label>
        </div>

        <input type="checkbox" id="menu-toggle">

        <ul class="nav-menu">
            <!-- Home -->
            <li>
                <a href="{{ url_for('home') }}">Home</a>
                <ul class="dropdown">
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Latest News</a></li>
                    <li><a href="#">Featured</a></li>
                </ul>
            </li>

            <!-- About -->
            <li>
                <a href="{{ url_for('about') }}">About Us</a>
                <ul class="dropdown">
                    <li><a href="#">Our Story</a></li>
                    <li><a href="#">Our Team</a></li>
                    <li><a href="#">Careers</a></li>
                </ul>
            </li>

            <!-- Contact -->
            <li>
                <a href="{{ url_for('contact') }}">Contact Us</a>
                <ul class="dropdown">
                    <li><a href="#">Support</a></li>
                    <li><a href="#">Sales</a></li>
                    <li><a href="#">Locations</a></li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<script>
    // Theme Switcher Logic
    const toggleBtn = document.getElementById('themeToggleBtn');
    const htmlElement = document.documentElement;

    // Check saved theme or system preference on load
    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    
    htmlElement.setAttribute('data-theme', savedTheme);
    updateIcon(savedTheme);

    toggleBtn.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcon(newTheme);
    });

    function updateIcon(theme) {
        toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
</script>

</body>
</html>
